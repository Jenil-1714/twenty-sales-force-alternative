<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InsureCRM — Commission Reconciliation & Tax Data Flow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-border: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #475569;
      --primary: #2563eb;
      --primary-light: #eff6ff;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text-main); padding: 40px 24px; line-height: 1.5; }
    .container { max-width: 1280px; margin: 0 auto; }
    header { margin-bottom: 32px; border-bottom: 1px solid var(--surface-border); padding-bottom: 20px; }
    .badge { display: inline-block; background: var(--primary-light); color: var(--primary); font-weight: 600; font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 1px solid #bfdbfe; margin-bottom: 12px; }
    h1 { font-size: 28px; font-weight: 700; color: var(--text-main); letter-spacing: -0.02em; }
    p.subtitle { color: var(--text-muted); font-size: 15px; margin-top: 6px; }

    .canvas-card { background: var(--surface); border: 1px solid var(--surface-border); border-radius: var(--radius); padding: 32px; box-shadow: var(--shadow); }
    svg { width: 100%; height: auto; display: block; }
    
    .node-title { font-size: 13px; font-weight: 700; fill: #0f172a; }
    .node-desc { font-size: 11px; fill: #64748b; }
    .tag-blue { font-size: 9px; font-weight: 700; fill: #2563eb; }
    .tag-green { font-size: 9px; font-weight: 700; fill: #16a34a; }
    .tag-orange { font-size: 9px; font-weight: 700; fill: #d97706; }
    .tag-red { font-size: 9px; font-weight: 700; fill: #dc2626; }

    footer { margin-top: 32px; text-align: center; color: var(--text-muted); font-size: 13px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <span class="badge">DATA FLOW DIAGRAM</span>
      <h1>InsureCRM Commission Reconciliation & Tax Data Flow</h1>
      <p class="subtitle">Insurer Payout Statement ingestion, Section 194D TDS calculation, GST tax split & discrepancy workflow</p>
    </header>

    <div class="canvas-card">
      <svg viewBox="0 0 1100 640" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb" />
          </marker>
        </defs>

        <!-- STEP 1: STATEMENT INGESTION -->
        <g transform="translate(40, 60)">
          <rect width="200" height="120" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
          <text x="16" y="28" class="node-title">1. Ingest Payout Statement</text>
          <text x="16" y="48" class="node-desc">Insurer Monthly CSV / Excel</text>
          <text x="16" y="64" class="node-desc">Statement Ref &amp; Payout Lines</text>
          <rect x="16" y="82" width="120" height="20" rx="4" fill="#dbeafe"/>
          <text x="24" y="96" class="tag-blue">HTTP `/reconcile-commission`</text>
        </g>

        <!-- Arrow 1 -> 2 -->
        <path d="M 240 120 L 300 120" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>

        <!-- STEP 2: POLICY MATCHING ENGINE -->
        <g transform="translate(300, 60)">
          <rect width="220" height="120" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
          <text x="16" y="28" class="node-title">2. Policy Lookup Engine</text>
          <text x="16" y="48" class="node-desc">Matches `policyNumber` &amp; Insurer</text>
          <text x="16" y="64" class="node-desc">Pulls Expected First Year / Renewal %</text>
          <rect x="16" y="82" width="130" height="20" rx="4" fill="#dbeafe"/>
          <text x="24" y="96" class="tag-blue">EXPECTED PAYOUT CALCULATOR</text>
        </g>

        <!-- Arrow 2 -> 3 -->
        <path d="M 520 120 L 580 120" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>

        <!-- STEP 3: TAX CALCULATION ENGINE -->
        <g transform="translate(580, 60)">
          <rect width="240" height="120" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
          <text x="16" y="28" class="node-title">3. Section 194D &amp; GST Engine</text>
          <text x="16" y="48" class="node-desc">TDS: 5% Individual / 10% Corp</text>
          <text x="16" y="64" class="node-desc">GST: 18% CGST+SGST or IGST</text>
          <rect x="16" y="82" width="140" height="20" rx="4" fill="#fef3c7"/>
          <text x="24" y="96" class="tag-orange">INDIAN TAX DEDUCTOR</text>
        </g>

        <!-- Arrow 3 -> 4 -->
        <path d="M 820 120 L 880 120" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>

        <!-- STEP 4: VARIANCE CLASSIFIER -->
        <g transform="translate(880, 60)">
          <rect width="180" height="120" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
          <text x="16" y="28" class="node-title">4. Variance Classifier</text>
          <text x="16" y="48" class="node-desc">Expected vs Received Net</text>
          <text x="16" y="64" class="node-desc">Calculates Variance Amount</text>
          <rect x="16" y="82" width="130" height="20" rx="4" fill="#dbeafe"/>
          <text x="24" y="96" class="tag-blue">VARIANCE COMPUTATOR</text>
        </g>

        <!-- BRANCHES FROM VARIANCE CLASSIFIER -->
        <!-- Path 4 -> Branch 1: MATCH -->
        <path d="M 970 180 L 970 300 L 200 300 L 200 360" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>

        <!-- Path 4 -> Branch 2: SHORTFALL -->
        <path d="M 970 180 L 970 300 L 500 300 L 500 360" stroke="#d97706" stroke-width="2" marker-end="url(#arrow)"/>

        <!-- Path 4 -> Branch 3: EXCESS / DISPUTED -->
        <path d="M 970 180 L 970 360" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>

        <!-- BRANCH 1: MATCH -->
        <g transform="translate(100, 360)">
          <rect width="200" height="140" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
          <text x="16" y="28" class="node-title" fill="#15803d">Status: MATCH</text>
          <text x="16" y="48" class="node-desc">Variance == 0</text>
          <text x="16" y="66" class="node-desc">Full payout verified</text>
          <text x="16" y="84" class="node-desc">Auto-settles commission status</text>
          <rect x="16" y="104" width="100" height="20" rx="4" fill="#bbf7d0"/>
          <text x="24" y="118" class="tag-green">STATUS: RECEIVED</text>
        </g>

        <!-- BRANCH 2: SHORTFALL -->
        <g transform="translate(400, 360)">
          <rect width="200" height="140" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
          <text x="16" y="28" class="node-title" fill="#b45309">Status: SHORTFALL</text>
          <text x="16" y="48" class="node-desc">Received &lt; Expected</text>
          <text x="16" y="66" class="node-desc">Triggers `flag-commission`</text>
          <text x="16" y="84" class="node-desc">Generates Discrepancy Ticket</text>
          <rect x="16" y="104" width="130" height="20" rx="4" fill="#fef3c7"/>
          <text x="24" y="118" class="tag-orange">ALERT BACK-OFFICE</text>
        </g>

        <!-- BRANCH 3: EXCESS / DISPUTED -->
        <g transform="translate(700, 360)">
          <rect width="200" height="140" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
          <text x="16" y="28" class="node-title" fill="#991b1b">Status: EXCESS / DISPUTE</text>
          <text x="16" y="48" class="node-desc">Received &gt; Expected or Unmatched</text>
          <text x="16" y="66" class="node-desc">Clawback or manual review</text>
          <text x="16" y="84" class="node-desc">Flags Insurer Ops team</text>
          <rect x="16" y="104" width="110" height="20" rx="4" fill="#fecaca"/>
          <text x="24" y="118" class="tag-red">MANUAL AUDIT</text>
        </g>

        <!-- SUMMARY RIBBON AT BOTTOM -->
        <g transform="translate(100, 540)">
          <rect width="800" height="45" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
          <text x="16" y="27" font-size="11" font-weight="600" fill="#475569">InsureCRM Commission Audit Output: Real-time net agent payout calculation, TDS Certificate Form 16A mapping &amp; Brokerage P&amp;L Ledger</text>
        </g>
      </svg>
    </div>

    <footer>
      InsureCRM Commission Reconciliation Data Flow Diagram • Generated using `diagram-design` skill
    </footer>
  </div>
</body>
</html>
