<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InsureCRM — Policy Lifecycle State Machine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-border: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #475569;
      --primary: #2563eb;
      --primary-light: #eff6ff;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text-main); padding: 40px 24px; line-height: 1.5; }
    .container { max-width: 1280px; margin: 0 auto; }
    header { margin-bottom: 32px; border-bottom: 1px solid var(--surface-border); padding-bottom: 20px; }
    .badge { display: inline-block; background: var(--primary-light); color: var(--primary); font-weight: 600; font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 1px solid #bfdbfe; margin-bottom: 12px; }
    h1 { font-size: 28px; font-weight: 700; color: var(--text-main); letter-spacing: -0.02em; }
    p.subtitle { color: var(--text-muted); font-size: 15px; margin-top: 6px; }

    .canvas-card { background: var(--surface); border: 1px solid var(--surface-border); border-radius: var(--radius); padding: 32px; box-shadow: var(--shadow); }
    svg { width: 100%; height: auto; display: block; }
    
    .state-title { font-size: 12px; font-weight: 700; fill: #0f172a; }
    .state-desc { font-size: 10px; fill: #64748b; }
    .transition-text { font-size: 9px; font-weight: 700; fill: #2563eb; }

    footer { margin-top: 32px; text-align: center; color: var(--text-muted); font-size: 13px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <span class="badge">STATE MACHINE</span>
      <h1>InsureCRM Policy Lifecycle & Transition State Machine</h1>
      <p class="subtitle">Complete lifecycle of an Indian insurance policy from Proposal Submission to Renewal, Lapse, Claim & Maturity</p>
    </header>

    <div class="canvas-card">
      <svg viewBox="0 0 1100 680" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb" />
          </marker>
          <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a" />
          </marker>
          <marker id="arrow-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626" />
          </marker>
        </defs>

        <!-- STAGE 1: PROPOSAL -->
        <g transform="translate(40, 100)">
          <circle cx="20" cy="30" r="12" fill="#2563eb"/>
          <rect x="50" y="5" width="140" height="50" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
          <text x="62" y="27" class="state-title">1. PROPOSAL</text>
          <text x="62" y="42" class="state-desc">Draft & KYC Upload</text>
        </g>

        <!-- Path 1 -> 2 -->
        <path d="M 230 130 L 290 130" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
        <text x="235" y="122" class="transition-text">Submit Proposal</text>

        <!-- STAGE 2: UNDERWRITING -->
        <g transform="translate(300, 100)">
          <rect x="0" y="5" width="150" height="50" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
          <text x="12" y="27" class="state-title">2. UNDERWRITING</text>
          <text x="12" y="42" class="state-desc">Medical / MER Check</text>
        </g>

        <!-- Path 2 -> 3 -->
        <path d="M 450 130 L 510 130" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
        <text x="455" y="122" class="transition-text" fill="#16a34a">Approved</text>

        <!-- STAGE 3: PENDING ISSUANCE -->
        <g transform="translate(520, 100)">
          <rect x="0" y="5" width="160" height="50" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
          <text x="12" y="27" class="state-title">3. PENDING ISSUANCE</text>
          <text x="12" y="42" class="state-desc">Payment & Policy #</text>
        </g>

        <!-- Path 3 -> 4 -->
        <path d="M 680 130 L 740 130" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
        <text x="685" y="122" class="transition-text" fill="#16a34a">Issued</text>

        <!-- STAGE 4: ACTIVE (Core State) -->
        <g transform="translate(750, 90)">
          <rect x="0" y="0" width="180" height="70" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
          <text x="16" y="30" class="state-title" font-size="14" fill="#15803d">4. ACTIVE (In-Force)</text>
          <text x="16" y="48" class="state-desc">Claims / Benefits Covered</text>
        </g>

        <!-- Path 4 -> Free Look Cancel -->
        <path d="M 840 90 L 840 40 L 600 40" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow-red)"/>
        <text x="670" y="32" class="transition-text" fill="#dc2626">30-Day Free Look Cancel</text>

        <!-- Path 4 -> 5 (Premium Due Scanner) -->
        <path d="M 840 160 L 840 250" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
        <text x="850" y="200" class="transition-text">Due Date - 60 Days</text>

        <!-- STAGE 5: PREMIUM DUE -->
        <g transform="translate(750, 260)">
          <rect x="0" y="0" width="180" height="60" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
          <text x="14" y="28" class="state-title" fill="#b45309">5. PREMIUM DUE</text>
          <text x="14" y="44" class="state-desc">WhatsApp Reminders Active</text>
        </g>

        <!-- Path 5 -> 4 (Renewal Paid) -->
        <path d="M 780 260 L 780 160" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
        <text x="700" y="210" class="transition-text" fill="#16a34a">Premium Paid</text>

        <!-- Path 5 -> 6 (Grace Period) -->
        <path d="M 840 320 L 840 400" stroke="#d97706" stroke-width="2" marker-end="url(#arrow)"/>
        <text x="850" y="360" class="transition-text" fill="#d97706">Due Date Passed</text>

        <!-- STAGE 6: GRACE PERIOD -->
        <g transform="translate(750, 410)">
          <rect x="0" y="0" width="180" height="60" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
          <text x="14" y="28" class="state-title" fill="#92400e">6. GRACE PERIOD</text>
          <text x="14" y="44" class="state-desc">30-Day IRDAI Grace Window</text>
        </g>

        <!-- Path 6 -> 7 (Lapsed) -->
        <path d="M 840 470 L 840 550" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
        <text x="850" y="515" class="transition-text" fill="#dc2626">Grace Period Expired</text>

        <!-- STAGE 7: LAPSED -->
        <g transform="translate(750, 560)">
          <rect x="0" y="0" width="180" height="60" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
          <text x="14" y="28" class="state-title" fill="#991b1b">7. LAPSED</text>
          <text x="14" y="44" class="state-desc">No Coverage Active</text>
        </g>

        <!-- Path 7 -> Revival Pending -->
        <path d="M 750 590 L 580 590" stroke="#9333ea" stroke-width="2" marker-end="url(#arrow)"/>
        <text x="610" y="580" class="transition-text" fill="#9333ea">Request Revival</text>

        <!-- STAGE 8: REVIVAL PENDING -->
        <g transform="translate(390, 560)">
          <rect x="0" y="0" width="180" height="60" rx="8" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5"/>
          <text x="14" y="28" class="state-title" fill="#6b21a8">8. REVIVAL PENDING</text>
          <text x="14" y="44" class="state-desc">DGH & Interest Check</text>
        </g>

        <!-- Path 8 -> 4 (Revived back to Active) -->
        <path d="M 480 560 L 480 200 L 750 200" stroke="#16a34a" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-green)"/>
        <text x="490" y="370" class="transition-text" fill="#16a34a">Revival Approved</text>

        <!-- TERMINAL STATES FROM ACTIVE -->
        <g transform="translate(100, 320)">
          <rect width="160" height="50" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
          <text x="12" y="27" class="state-title">9. MATURED</text>
          <text x="12" y="42" class="state-desc">End of Policy Term</text>
        </g>

        <g transform="translate(100, 400)">
          <rect width="160" height="50" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
          <text x="12" y="27" class="state-title">10. CLAIMED / PAID</text>
          <text x="12" y="42" class="state-desc">Death / Total Loss Settlement</text>
        </g>

        <path d="M 750 140 L 270 340" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
        <path d="M 750 150 L 270 420" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>

      </svg>
    </div>

    <footer>
      InsureCRM Policy State Machine Diagram • Generated using `diagram-design` skill
    </footer>
  </div>
</body>
</html>
