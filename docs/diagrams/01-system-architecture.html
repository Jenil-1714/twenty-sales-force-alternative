  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-border: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #475569;
      --primary: #2563eb;
      --primary-light: #eff6ff;
      --primary-border: #bfdbfe;
      --success: #16a34a;
      --success-light: #f0fdf4;
      --warning: #d97706;
      --warning-light: #fffbeb;
      --purple: #9333ea;
      --purple-light: #faf5ff;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text-main); padding: 40px 24px; line-height: 1.5; }
    .container { max-width: 1280px; margin: 0 auto; }
    header { margin-bottom: 32px; border-bottom: 1px solid var(--surface-border); padding-bottom: 20px; }
    .badge { display: inline-block; background: var(--primary-light); color: var(--primary); font-weight: 600; font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--primary-border); margin-bottom: 12px; }
    h1 { font-size: 28px; font-weight: 700; color: var(--text-main); letter-spacing: -0.02em; }
    p.subtitle { color: var(--text-muted); font-size: 15px; margin-top: 6px; }

    /* SVG Canvas styling */
    .canvas-card { background: var(--surface); border: 1px solid var(--surface-border); border-radius: var(--radius); padding: 32px; box-shadow: var(--shadow); }
    svg { width: 100%; height: auto; display: block; }
    
    .node-title { font-size: 14px; font-weight: 700; fill: #0f172a; }
    .node-desc { font-size: 11px; fill: #64748b; }
    .node-tag { font-size: 10px; font-weight: 600; fill: #2563eb; }
    .layer-label { font-size: 13px; font-weight: 700; fill: #475569; text-transform: uppercase; letter-spacing: 0.05em; }

    footer { margin-top: 32px; text-align: center; color: var(--text-muted); font-size: 13px; }
  </style>
</head>
